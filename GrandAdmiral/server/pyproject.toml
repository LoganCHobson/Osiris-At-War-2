[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-admiral-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "osiris-ml",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "psycopg[binary]>=3.1,<4",
    "prometheus-client>=0.20,<1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
