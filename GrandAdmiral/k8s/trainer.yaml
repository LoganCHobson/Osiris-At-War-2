# Nightly training round: check new uploads, train, gate, and (only if every check passes) sign
# and release a new model. The signing key exists only in this pod. It accepts no connections and
# can reach nothing but the database (networkpolicy.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grand-admiral-trainer
spec:
  schedule: "17 */6 * * *"         # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400   # a real round (60 epochs over ~350k decisions + 400 bootstraps) runs past an hour
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: { app: grand-admiral-trainer }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets: [{ name: ghcr-pull-secret }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001   # secrets are mounted root:10001 0440, readable by the app user only
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: trainer
              image: ghcr.io/loganchobson/grand-admiral-trainer:latest
              args: [round]
              env:
                - name: GA_DB_URL
                  valueFrom: { secretKeyRef: { name: grand-admiral-trainer, key: db-url } }
                - { name: GA_SIGNING_KEY_FILE, value: /secrets/signing-key.pem }
                - name: GA_SIGNING_KEY_PASS
                  valueFrom: { secretKeyRef: { name: grand-admiral-trainer, key: signing-key-pass, optional: true } }
                - name: GA_KEY_ID
                  valueFrom: { secretKeyRef: { name: grand-admiral-trainer, key: key-id } }
                - name: GA_SELFPLAY_INSTALLS
                  valueFrom: { configMapKeyRef: { name: grand-admiral-config, key: selfplay-installs } }
                - { name: GA_REQUIRE_ARENA, value: "true" }   # New models must win in self-play before players get them.
                - name: GA_MIN_CLIENT_VERSION
                  valueFrom: { configMapKeyRef: { name: grand-admiral-config, key: min-client-version, optional: true } }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 500m, memory: 512Mi }
                limits: { cpu: "2", memory: 3Gi }
              volumeMounts:
                - { name: signing-key, mountPath: /secrets, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: signing-key
              secret:
                secretName: grand-admiral-trainer
                items: [{ key: signing-key.pem, path: signing-key.pem }]
                defaultMode: 0440
            - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
