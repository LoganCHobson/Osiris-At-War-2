# Default deny, then exactly the connections each piece needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
# API: reachable from the shared Gateway's nginx pods (the internet) and from self-play; talks only to the DB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector: { matchLabels: { app: grand-admiral-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: nginx-gateway } }
          podSelector: { matchLabels: { gateway.networking.k8s.io/gateway-name: home } }
        - podSelector: { matchLabels: { app: grand-admiral-selfplay } }
      ports: [{ port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: grand-admiral-db } } }]
      ports: [{ port: 5432 }]
---
# Database: only the API and the trainer; no egress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db
spec:
  podSelector: { matchLabels: { app: grand-admiral-db } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: grand-admiral-api } }
        - podSelector: { matchLabels: { app: grand-admiral-trainer } }
        - podSelector: { matchLabels: { app: grand-admiral-metrics } }
      ports: [{ port: 5432 }]
---
# Trainer (holds the signing key): no ingress, egress to the DB only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trainer
spec:
  podSelector: { matchLabels: { app: grand-admiral-trainer } }
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: grand-admiral-db } } }]
      ports: [{ port: 5432 }]
---
# Self-play farm: the API and the player store, nothing else (a built player needs no licensing or GitHub).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: selfplay
spec:
  podSelector: { matchLabels: { app: grand-admiral-selfplay } }
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: grand-admiral-api } } }]
      ports: [{ port: 8080 }]
    - to: [{ podSelector: { matchLabels: { app: grand-admiral-player-store } } }]
      ports: [{ port: 8080 }]
---
# Player store: serves the self-play build to the farm only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: player-store
spec:
  podSelector: { matchLabels: { app: grand-admiral-player-store } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: grand-admiral-selfplay } } }]
      ports: [{ port: 8080 }]
---
# Metrics exporter: scraped by Prometheus, reads the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics
spec:
  podSelector: { matchLabels: { app: grand-admiral-metrics } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports: [{ port: 9100 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: grand-admiral-db } } }]
      ports: [{ port: 5432 }]
