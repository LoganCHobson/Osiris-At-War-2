# kubectl apply -k GrandAdmiral/k8s   (secrets first: see README, "Deploy")
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oawga-machine-learning
resources:
  - namespace.yaml
  - config.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - api.yaml
  - httproute.yaml
  - trainer.yaml
  - selfplay.yaml
  - metrics.yaml
  - grafana-dashboard.yaml
configMapGenerator:
  - name: grand-admiral-db-init
    files: [postgres-init.sql, postgres-init.sh]
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: ghcr.io/loganchobson/grand-admiral-api
    newTag: 255eedac1e63   # the deployed build; CI bumps it on deploy, set it by hand when deploying by hand
  - name: ghcr.io/loganchobson/grand-admiral-trainer
    newTag: 255eedac1e63   # the deployed build; CI bumps it on deploy, set it by hand when deploying by hand
