# One-off experiment, not part of the kustomization: which of the Admiral's behaviours are worth anything? Admiral
# against Admiral, one side with a behaviour switched off (DifficultySim -ablate), straight fights only (-openOnly).
#   python GrandAdmiral/tools/probe-report.py --label ga-ablate
#
# (Copied from matchup.yaml:) does better play win at equal cost? The hand-written
# difficulty levels against each other (DifficultySim -matchup), farm-style battles, nothing uploaded.
# Admiral-vs-Admiral is the control (should be ~50%). Same setup and report tool as probe.yaml:
#   python GrandAdmiral/tools/probe-report.py --label ga-matchup
#
# (Below: the probe.yaml header this was copied from.)
# One-off experiment, not part of the kustomization: do the Grand Admiral's decisions change who wins?
# Self-play's battles (equal cost, fresh maps, a third campaign-style), with the released model making
# every call except those a test commander overrides (GAProbe.cs): at random, or fixed. Nothing is
# uploaded. Each pod plays 5 rounds (20 battles) of one commander and exits; results are the GASTAT lines
# in the pods' logs (GrandAdmiral/tools/probe-report.py adds them up).
#
# Pods carry the farm's label for the network policy, so pause the farm and suspend the conductor first:
#   kubectl -n oawga-machine-learning patch cronjob grand-admiral-conductor -p '{"spec":{"suspend":true}}'
#   kubectl -n oawga-machine-learning scale deploy/grand-admiral-selfplay --replicas 0
# and undo both when it's done (replicas 6, suspend false).
apiVersion: batch/v1
kind: Job
metadata:
  name: ga-ablate
spec:
  completionMode: Indexed
  completions: 64           # 8 variants x 8 pods x 20 battles = 160 battles each
  parallelism: 8
  backoffLimitPerIndex: 2
  maxFailedIndexes: 30
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: { app: grand-admiral-selfplay, experiment: ga-ablate }
    spec:
      restartPolicy: Never
      priorityClassName: grand-admiral-selfplay
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { experiment: ga-ablate } }
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fetch-player
          image: busybox:1.36
          command: [sh, -c, "wget -q -O - http://grand-admiral-player-store:8080/osiris-selfplay.tar.gz | tar -xz -C /player && chmod +x /player/osiris-selfplay"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: player, mountPath: /player }
      containers:
        - name: probe
          image: ubuntu:24.04
          command:
            - sh
            - -c
            - |
              set -- "" "focusFire=false" "holdReserves=false" "manageStance=false" "pickDropZones=false" "priorityMoveSkill=0"                      "targetMistakeChance=0.35" "focusFire=false,targetMistakeChance=0.35,manageStance=false,pickDropZones=false,holdReserves=false,priorityMoveSkill=0,decisionInterval=2.2,reinforcementDelayScale=2.5"
              shift $((JOB_COMPLETION_INDEX % 8))
              echo "PROBE commander=ablate:$1 index=$JOB_COMPLETION_INDEX"
              exec /player/osiris-selfplay -batchmode -nographics -matchup Admiral:Admiral -ablate "$1" -openOnly -selfPlayRounds 5 -simSpeed 6                 -gaServer http://grand-admiral-api.oawga-machine-learning.svc.cluster.local:8080 \
                -gaCredentials /secrets/selfplay/credentials.json -logFile -
          env:
            - { name: HOME, value: /home/selfplay }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 2Gi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - { name: player, mountPath: /player, readOnly: true }
            - { name: home, mountPath: /home/selfplay }
            - { name: tmp, mountPath: /tmp }
            - { name: selfplay, mountPath: /secrets/selfplay, readOnly: true }
      volumes:
        - { name: player, emptyDir: { sizeLimit: 1Gi } }
        - { name: home, emptyDir: { sizeLimit: 512Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 512Mi } }
        - name: selfplay
          secret: { secretName: grand-admiral-selfplay, defaultMode: 0440 }
