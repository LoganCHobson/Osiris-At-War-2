# Public entry point: https://ga.solarnebulae.com (TLS from cert-manager).
# Adjust ingressClassName and the cluster-issuer annotation to match the homelab's ingress
# controller and ClusterIssuer if they're named differently. The nginx annotations are a first
# line of defence; the API enforces its own limits and sends HSTS itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grand-admiral-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 600k
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-connections: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ga.solarnebulae.com]
      secretName: grand-admiral-tls
  rules:
    - host: ga.solarnebulae.com
      http:
        paths:
          - path: /v1/
            pathType: Prefix
            backend: { service: { name: grand-admiral-api, port: { number: 8080 } } }
